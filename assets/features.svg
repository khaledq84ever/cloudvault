<svg xmlns="http://www.w3.org/2000/svg" width="900" height="430" viewBox="0 0 900 430" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <rect width="900" height="430" rx="16" fill="#16161a"/>
  <rect x="1" y="1" width="898" height="428" rx="15" fill="none" stroke="#2a2a30"/>
  <text x="32" y="48" fill="#f5f1ea" font-size="22" font-weight="800">Everything Dropbox does — yours to host</text>

  <!-- row 1 -->
  <g transform="translate(32,78)">
    <rect width="270" height="148" rx="14" fill="#1a1a1f" stroke="#2a2a30"/>
    <rect x="20" y="22" width="44" height="44" rx="11" fill="#241f15"/>
    <g transform="translate(31,33)" fill="none" stroke="#d4a843" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><path d="M3 14 a6 6 0 0 1 1 -12 a7 7 0 0 1 13 1.5 a5 5 0 0 1 1 10 z"/><path d="M11 20 v-9 M7 14 l4 -4 l4 4"/></g>
    <text x="20" y="96" fill="#f5f1ea" font-size="16" font-weight="700">Drag &amp; drop upload</text>
    <text x="20" y="118" fill="#d6d0c4" font-size="12.5">Multi-file with a live</text>
    <text x="20" y="135" fill="#d6d0c4" font-size="12.5">progress bar.</text>
  </g>
  <g transform="translate(315,78)">
    <rect width="270" height="148" rx="14" fill="#1a1a1f" stroke="#2a2a30"/>
    <rect x="20" y="22" width="44" height="44" rx="11" fill="#241f15"/>
    <g transform="translate(31,33)" fill="none" stroke="#6dbf8f" stroke-width="3"><circle cx="11" cy="11" r="4"/><path d="M1 11 C5 4 17 4 21 11 C17 18 5 18 1 11 z"/></g>
    <text x="20" y="96" fill="#f5f1ea" font-size="16" font-weight="700">Inline previews</text>
    <text x="20" y="118" fill="#d6d0c4" font-size="12.5">Images, video, audio,</text>
    <text x="20" y="135" fill="#d6d0c4" font-size="12.5">PDF &amp; text — no download.</text>
  </g>
  <g transform="translate(598,78)">
    <rect width="270" height="148" rx="14" fill="#1a1a1f" stroke="#2a2a30"/>
    <rect x="20" y="22" width="44" height="44" rx="11" fill="#241f15"/>
    <g transform="translate(31,32)" fill="none" stroke="#6366f1" stroke-width="3" stroke-linecap="round"><path d="M8 14 a5 5 0 0 0 7 0 l4 -4 a5 5 0 0 0 -7 -7 l-2 2"/><path d="M14 8 a5 5 0 0 0 -7 0 l-4 4 a5 5 0 0 0 7 7 l2 -2"/></g>
    <text x="20" y="96" fill="#f5f1ea" font-size="16" font-weight="700">Public share links</text>
    <text x="20" y="118" fill="#d6d0c4" font-size="12.5">Optional expiry &amp;</text>
    <text x="20" y="135" fill="#d6d0c4" font-size="12.5">password protection.</text>
  </g>

  <!-- row 2 -->
  <g transform="translate(32,242)">
    <rect width="270" height="148" rx="14" fill="#1a1a1f" stroke="#2a2a30"/>
    <rect x="20" y="22" width="44" height="44" rx="11" fill="#241f15"/>
    <path d="M42 31 l3.4 7 l7.6 0.6 l-5.8 5 l1.8 7.4 l-7 -4 l-7 4 l1.8 -7.4 l-5.8 -5 l7.6 -0.6 z" fill="#e0a35a"/>
    <text x="20" y="96" fill="#f5f1ea" font-size="16" font-weight="700">Star, rename &amp; trash</text>
    <text x="20" y="118" fill="#d6d0c4" font-size="12.5">Soft-delete with restore;</text>
    <text x="20" y="135" fill="#d6d0c4" font-size="12.5">folders &amp; breadcrumbs.</text>
  </g>
  <g transform="translate(315,242)">
    <rect width="270" height="148" rx="14" fill="#1a1a1f" stroke="#2a2a30"/>
    <rect x="20" y="22" width="44" height="44" rx="11" fill="#241f15"/>
    <g transform="translate(31,31)" fill="none" stroke="#d4a843" stroke-width="3"><rect x="1" y="1" width="20" height="20" rx="4"/><path d="M6 11 h10 M11 6 v10" stroke-linecap="round"/></g>
    <text x="20" y="96" fill="#f5f1ea" font-size="16" font-weight="700">15 GB free quota</text>
    <text x="20" y="118" fill="#d6d0c4" font-size="12.5">Per-user, configurable;</text>
    <text x="20" y="135" fill="#d6d0c4" font-size="12.5">live usage bar.</text>
  </g>
  <g transform="translate(598,242)">
    <rect width="270" height="148" rx="14" fill="#1a1a1f" stroke="#2a2a30"/>
    <rect x="20" y="22" width="44" height="44" rx="11" fill="#241f15"/>
    <g transform="translate(31,30)" fill="none" stroke="#6dbf8f" stroke-width="3" stroke-linecap="round"><rect x="3" y="1" width="16" height="24" rx="3"/><line x1="9" y1="21" x2="13" y2="21"/></g>
    <text x="20" y="96" fill="#f5f1ea" font-size="16" font-weight="700">PWA &amp; mobile-first</text>
    <text x="20" y="118" fill="#d6d0c4" font-size="12.5">Installable, offline page,</text>
    <text x="20" y="135" fill="#d6d0c4" font-size="12.5">bottom nav on phones.</text>
  </g>
</svg>
