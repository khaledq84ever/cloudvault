<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c27a"/><stop offset="1" stop-color="#c98a3e"/></linearGradient>
  </defs>
  <rect width="900" height="560" rx="18" fill="#16161a"/>
  <rect x="1" y="1" width="898" height="558" rx="17" fill="none" stroke="#2a2a30"/>

  <!-- top bar -->
  <g transform="translate(28,26)">
    <circle cx="0" cy="0" r="6" fill="#dc2626"/><circle cx="20" cy="0" r="6" fill="#e0a35a"/><circle cx="40" cy="0" r="6" fill="#6dbf8f"/>
    <text x="92" y="5" fill="#6e6862" font-size="13">cloudvault-production-9ea1.up.railway.app</text>
  </g>

  <!-- sidebar -->
  <rect x="24" y="56" width="194" height="480" rx="14" fill="#1a1a1f" stroke="#2a2a30"/>
  <g transform="translate(44,84)">
    <rect width="30" height="30" rx="9" fill="url(#g)"/>
    <circle cx="15" cy="15" r="6.5" fill="#1a1a1f"/><circle cx="15" cy="15" r="2.4" fill="#e8c27a"/>
    <text x="42" y="20" fill="#f5f1ea" font-size="17" font-weight="700">CloudVault</text>
  </g>
  <g transform="translate(44,138)"><rect width="150" height="40" rx="11" fill="url(#g)"/><text x="75" y="25" fill="#16161a" font-size="14" font-weight="700" text-anchor="middle">+ Upload</text></g>
  <g font-size="14" transform="translate(44,206)">
    <g><rect x="-12" y="-16" width="174" height="34" rx="9" fill="#241f15"/><text y="6" fill="#e8c27a" font-weight="600">&#128193;  My Drive</text></g>
    <text y="52" fill="#d6d0c4">&#11088;  Starred</text>
    <text y="92" fill="#d6d0c4">&#128247;  Photos</text>
    <text y="132" fill="#d6d0c4">&#128465;  Trash</text>
  </g>
  <!-- quota -->
  <g transform="translate(44,430)">
    <text y="0" fill="#6e6862" font-size="12">6.2 GB of 15 GB used</text>
    <rect y="10" width="150" height="9" rx="4.5" fill="#2a2a30"/><rect y="10" width="62" height="9" rx="4.5" fill="url(#g)"/>
  </g>

  <!-- main header -->
  <text x="244" y="84" fill="#f5f1ea" font-size="22" font-weight="800">My Drive</text>
  <text x="244" y="106" fill="#6e6862" font-size="13">Home / Projects</text>
  <g transform="translate(640,64)"><rect width="232" height="36" rx="10" fill="#1f1f26" stroke="#2a2a30"/><circle cx="20" cy="18" r="6" fill="none" stroke="#6e6862" stroke-width="2"/><line x1="25" y1="23" x2="30" y2="28" stroke="#6e6862" stroke-width="2"/><text x="40" y="23" fill="#6e6862" font-size="13">Search files</text></g>

  <!-- file grid -->
  <g transform="translate(244,126)">
    <!-- folder -->
    <g><rect width="190" height="150" rx="14" fill="#1a1a1f" stroke="#2a2a30"/><path d="M28 44 h26 l8 8 h36 a4 4 0 0 1 4 4 v36 a4 4 0 0 1 -4 4 H28 a4 4 0 0 1 -4 -4 V48 a4 4 0 0 1 4 -4 z" fill="#d4a843"/><text x="20" y="120" fill="#f5f1ea" font-size="14" font-weight="600">Designs</text><text x="20" y="138" fill="#6e6862" font-size="11.5">24 items</text></g>
    <!-- image -->
    <g transform="translate(206,0)"><rect width="190" height="150" rx="14" fill="#1a1a1f" stroke="#2a2a30"/><rect x="20" y="20" width="150" height="64" rx="8" fill="#2c2c36"/><path d="M34 76 l20 -22 l16 16 l18 -26 l28 32 z" fill="#6dbf8f"/><circle cx="48" cy="44" r="8" fill="#e0a35a"/><text x="20" y="118" fill="#f5f1ea" font-size="14" font-weight="600">sunset.jpg</text><text x="20" y="136" fill="#6e6862" font-size="11.5">3.1 MB &#183; &#11088;</text></g>
    <!-- pdf -->
    <g transform="translate(412,0)"><rect width="190" height="150" rx="14" fill="#1a1a1f" stroke="#2a2a30"/><g transform="translate(70,20)"><path d="M0 0 h36 l14 14 v50 a4 4 0 0 1 -4 4 H4 a4 4 0 0 1 -4 -4 z" fill="#2c2c36"/><path d="M36 0 v14 h14" fill="#33333d"/><text x="25" y="46" fill="#dc2626" font-size="13" font-weight="800" text-anchor="middle">PDF</text></g><text x="20" y="118" fill="#f5f1ea" font-size="14" font-weight="600">invoice.pdf</text><text x="20" y="136" fill="#6e6862" font-size="11.5">182 KB</text></g>
    <!-- video -->
    <g transform="translate(0,166)"><rect width="190" height="150" rx="14" fill="#1a1a1f" stroke="#2a2a30"/><rect x="20" y="20" width="150" height="64" rx="8" fill="#2c2c36"/><circle cx="95" cy="52" r="18" fill="#16161a" opacity="0.7"/><path d="M90 44 l14 8 l-14 8 z" fill="#e8c27a"/><text x="20" y="118" fill="#f5f1ea" font-size="14" font-weight="600">demo.mp4</text><text x="20" y="136" fill="#6e6862" font-size="11.5">48 MB</text></g>
    <!-- audio -->
    <g transform="translate(206,166)"><rect width="190" height="150" rx="14" fill="#1a1a1f" stroke="#2a2a30"/><g transform="translate(56,30)" stroke="#6366f1" stroke-width="4" stroke-linecap="round"><line x1="0" y1="22" x2="0" y2="34"/><line x1="12" y1="14" x2="12" y2="42"/><line x1="24" y1="4" x2="24" y2="52"/><line x1="36" y1="16" x2="36" y2="40"/><line x1="48" y1="24" x2="48" y2="32"/><line x1="60" y1="10" x2="60" y2="46"/><line x1="72" y1="20" x2="72" y2="36"/></g><text x="20" y="118" fill="#f5f1ea" font-size="14" font-weight="600">track.mp3</text><text x="20" y="136" fill="#6e6862" font-size="11.5">5.4 MB</text></g>
    <!-- text doc -->
    <g transform="translate(412,166)"><rect width="190" height="150" rx="14" fill="#1a1a1f" stroke="#2a2a30"/><g transform="translate(66,24)" fill="#33333d"><rect width="58" height="6" rx="3"/><rect y="12" width="58" height="6" rx="3"/><rect y="24" width="42" height="6" rx="3"/><rect y="36" width="58" height="6" rx="3"/><rect y="48" width="30" height="6" rx="3"/></g><text x="20" y="118" fill="#f5f1ea" font-size="14" font-weight="600">notes.txt</text><text x="20" y="136" fill="#6e6862" font-size="11.5">2 KB</text></g>
  </g>

  <!-- upload toast -->
  <g transform="translate(640,470)">
    <rect width="232" height="60" rx="12" fill="#1f1f26" stroke="#4a3a1c"/>
    <circle cx="30" cy="30" r="14" fill="none" stroke="#2a2a30" stroke-width="4"/>
    <circle cx="30" cy="30" r="14" fill="none" stroke="#6dbf8f" stroke-width="4" stroke-linecap="round" stroke-dasharray="66 88" transform="rotate(-90 30 30)"/>
    <text x="56" y="26" fill="#f5f1ea" font-size="13" font-weight="600">Uploading 3 files</text>
    <text x="56" y="44" fill="#6e6862" font-size="11.5">photo-04.jpg &#183; 75%</text>
