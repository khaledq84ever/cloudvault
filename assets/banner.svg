<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="380" viewBox="0 0 1200 380" font-family="Inter, Segoe UI, system-ui, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1a1a1f"/><stop offset="1" stop-color="#16161a"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#e8c27a"/><stop offset="0.55" stop-color="#d4a843"/><stop offset="1" stop-color="#c98a3e"/></linearGradient>
    <radialGradient id="glow" cx="0.84" cy="0.2" r="0.75"><stop offset="0" stop-color="#d4a843" stop-opacity="0.22"/><stop offset="1" stop-color="#d4a843" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="1200" height="380" fill="url(#bg)"/>
  <rect width="1200" height="380" fill="url(#glow)"/>

  <!-- floating file cards -->
  <g opacity="0.9">
    <g transform="translate(905,70) rotate(-8)"><rect width="120" height="150" rx="14" fill="#21212a" stroke="#33333d"/><rect x="18" y="20" width="84" height="58" rx="8" fill="#2c2c36"/><path d="M30 64 l16 -18 l12 12 l14 -20 l20 26 z" fill="#6dbf8f"/><circle cx="40" cy="38" r="7" fill="#e0a35a"/><rect x="18" y="92" width="84" height="9" rx="4" fill="#33333d"/><rect x="18" y="110" width="58" height="9" rx="4" fill="#2c2c36"/></g>
    <g transform="translate(1040,140) rotate(7)"><rect width="120" height="150" rx="14" fill="#21212a" stroke="#33333d"/><path d="M30 28 h44 l16 16 v76 a4 4 0 0 1 -4 4 h-56 a4 4 0 0 1 -4 -4 z" fill="#2c2c36"/><path d="M74 28 v16 h16" fill="#33333d"/><rect x="30" y="64" width="60" height="8" rx="4" fill="#d4a843"/><rect x="30" y="82" width="44" height="8" rx="4" fill="#33333d"/><rect x="30" y="100" width="52" height="8" rx="4" fill="#33333d"/></g>
  </g>

  <!-- logo -->
  <g transform="translate(72,66)">
    <rect width="72" height="72" rx="18" fill="#1a1a1f" stroke="#33333d"/>
    <path d="M26 50 a13 13 0 0 1 2.5 -25 a15 15 0 0 1 28 3.5 a10.5 10.5 0 0 1 1.8 21 z" transform="translate(0,2)" fill="url(#gold)"/>
    <circle cx="42" cy="40" r="9" fill="#1a1a1f"/>
    <g stroke="#e8c27a" stroke-width="2.2" stroke-linecap="round"><line x1="42" y1="33" x2="42" y2="37"/><line x1="42" y1="43" x2="42" y2="47"/><line x1="35" y1="40" x2="39" y2="40"/><line x1="45" y1="40" x2="49" y2="40"/></g>
    <circle cx="42" cy="40" r="3" fill="#e8c27a"/>
  </g>

  <text x="166" y="98" fill="#f5f1ea" font-size="52" font-weight="800" letter-spacing="-1.5">CloudVault</text>
  <text x="168" y="140" fill="#d6d0c4" font-size="22" font-weight="500">Your personal cloud drive — upload, organize, preview &amp; share, from any device.</text>

  <!-- pills -->
  <g font-size="15.5" font-weight="600">
    <g transform="translate(168,176)"><rect width="178" height="38" rx="19" fill="#241f15" stroke="#4a3a1c"/><circle cx="22" cy="19" r="5.5" fill="#d4a843"/><text x="38" y="24" fill="#e8c27a">Drag &amp; drop upload</text></g>
    <g transform="translate(358,176)"><rect width="170" height="38" rx="19" fill="#241f15" stroke="#4a3a1c"/><circle cx="22" cy="19" r="5.5" fill="#6dbf8f"/><text x="38" y="24" fill="#e8c27a">Inline previews</text></g>
    <g transform="translate(540,176)"><rect width="172" height="38" rx="19" fill="#241f15" stroke="#4a3a1c"/><circle cx="22" cy="19" r="5.5" fill="#6366f1"/><text x="38" y="24" fill="#e8c27a">Share links</text></g>
    <g transform="translate(724,176)"><rect width="148" height="38" rx="19" fill="#241f15" stroke="#4a3a1c"/><circle cx="22" cy="19" r="5.5" fill="#e0a35a"/><text x="38" y="24" fill="#e8c27a">PWA / offline</text></g>
  </g>

  <!-- quota bar -->
  <g transform="translate(168,250)">
    <rect width="560" height="76" rx="14" fill="#1f1f26" stroke="#2a2a30"/>
    <text x="22" y="32" fill="#d6d0c4" font-size="14">Storage used</text>
    <text x="538" y="32" fill="#e8c27a" font-size="14" font-weight="700" text-anchor="end">6.2 GB / 15 GB</text>
    <rect x="22" y="44" width="516" height="12" rx="6" fill="#2a2a30"/>
    <rect x="22" y="44" width="214" height="12" rx="6" fill="url(#gold)"/>
  </g>

  <text x="72" y="362" fill="#5a544c" font-size="15" font-weight="500">Flask 3 &#183; SQLAlchemy &#183; vanilla JS &#183; deployed on Railway</text>
</svg>
