<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CloudVault">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<title>New password — CloudVault</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ cb }}">
</head>
<body class="auth-page">
<div class="auth-card">
  <a href="/" class="logo center">
    <svg aria-hidden="true" width="42" height="42" viewBox="0 0 24 24" fill="none">
      <defs><linearGradient id="lg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c98a3e"/><stop offset="100%" stop-color="#e0a35a"/></linearGradient></defs>
      <path d="M7 18a5 5 0 0 1-.7-9.95 6 6 0 0 1 11.6 1.05A4 4 0 0 1 17 18z" fill="url(#lg2)"/>
    </svg>
    <span style="font-size: 22px;">CloudVault</span>
  </a>

  {% if invalid %}
    <h1>Link expired</h1>
    <p class="sub">This reset link is invalid, expired, or has already been used.</p>
    <p class="alt"><a href="{{ url_for('forgot_password') }}">Request a new one</a></p>
  {% else %}
    <h1>Set a new password</h1>
    <p class="sub">Pick something at least 8 characters long.</p>
    {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
    <form method="POST" autocomplete="on">
      <label for="reset-password">New password</label>
      <input id="reset-password" type="password" name="password"
             minlength="8" required autofocus autocomplete="new-password">
      <button type="submit" class="btn btn-primary btn-block">Update password</button>
    </form>
    <p class="alt"><a href="{{ url_for('login') }}">Back to sign in</a></p>
  {% endif %}
</div>
<script src="/static/js/pwa.js?v={{ cb }}" defer></script>
</body>
</html>
