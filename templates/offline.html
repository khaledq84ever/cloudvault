<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<title>Offline — CloudVault</title>
<link rel="manifest" href="/manifest.webmanifest">
<link rel="apple-touch-icon" href="/static/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ cb }}">
</head>
<body class="auth-page">
<div class="auth-card" style="text-align:center;">
  <div style="margin-bottom:16px;"><svg aria-hidden="true" width="56" height="56" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M18 10h-1.3A7 7 0 0 0 5.1 11.5 5 5 0 0 0 6 21h12a4 4 0 0 0 0-8z"/><line x1="8" y1="12" x2="16" y2="12"/></svg></div>
  <h1>You're offline</h1>
  <p class="sub">CloudVault needs an internet connection to sync your files. Reconnect and we'll pick up right where you left off.</p>
  <button class="btn btn-primary btn-block" onclick="location.reload()">Try again</button>
  <p class="alt"><a href="/drive">Back to my drive</a></p>
</div>
<script>
  window.addEventListener('online', () => location.reload());
</script>
</body>
</html>
