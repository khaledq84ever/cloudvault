<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CloudVault">
<meta name="mobile-web-app-capable" content="yes">
<meta name="msapplication-TileColor" content="#0a0a0c">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<title>Sign up — CloudVault</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ cb }}">
</head>
<body class="auth-page {{ 'rtl' if dir == 'rtl' else '' }}">
<div class="auth-card">
  <a href="/" class="logo center">
    <svg class="ico" aria-hidden="true" width="42" height="42" viewBox="0 0 24 24" fill="none">
      <defs><linearGradient id="rg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#c98a3e"/><stop offset="100%" stop-color="#e0a35a"/></linearGradient></defs>
      <path d="M7 18a5 5 0 0 1-.7-9.95 6 6 0 0 1 11.6 1.05A4 4 0 0 1 17 18z" fill="url(#rg)"/>
    </svg>
    <span style="font-size: 22px;">CloudVault</span>
  </a>
  <h1>Get 500 MB free</h1>
  <p class="sub">Create your account in seconds</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}
  {% endwith %}
  <form method="POST" autocomplete="on">
    <label for="reg-name">Full name</label>
    <input id="reg-name" type="text" name="name" required autofocus
           autocomplete="name" autocapitalize="words" spellcheck="false">
    <label for="reg-email">Email</label>
    <input id="reg-email" type="email" name="email" required
           autocomplete="email" inputmode="email" autocapitalize="off"
           spellcheck="false">
    <label for="reg-password">Password <span class="hint">(6+ characters)</span></label>
    <input id="reg-password" type="password" name="password" required minlength="6"
           autocomplete="new-password">
    <button type="submit" class="btn btn-primary btn-block">Create account</button>
  </form>
  <p class="alt">Already have an account? <a href="{{ url_for('login') }}">Sign in</a></p>
</div>
<script src="/static/js/pwa.js?v={{ cb }}" defer></script>
</body>
</html>
