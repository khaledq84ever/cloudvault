<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CloudVault">
<meta name="mobile-web-app-capable" content="yes">
<meta name="msapplication-TileColor" content="#0a0a0c">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<title>Password required — CloudVault</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ cb }}">
</head>
<body class="auth-page">
<div class="auth-card">
  <a href="/" class="logo center">
    <svg width="36" height="36" viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.7-9.95 6 6 0 0 1 11.6 1.05A4 4 0 0 1 17 18z" fill="#c98a3e"/></svg>
    <span>CloudVault</span>
  </a>
  <h1>🔒 Password required</h1>
  <p class="sub">This shared file is password-protected.</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="POST" action="{{ url_for('public_share', token=token) }}">
    <label>Password</label>
    <input type="password" name="password" required autofocus>
    <button type="submit" class="btn btn-primary btn-block">Unlock</button>
  </form>
</div>
<script src="/static/js/pwa.js?v={{ cb }}" defer></script>
</body>
</html>
