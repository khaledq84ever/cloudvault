<!DOCTYPE html>
<html lang="{{ lang }}" dir="{{ dir }}">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CloudVault">
<meta name="mobile-web-app-capable" content="yes">
<meta name="msapplication-TileColor" content="#0a0a0c">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<title>{% if lang == 'ar' %}كلمة مرور مطلوبة — CloudVault{% else %}Password required — CloudVault{% endif %}</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Tajawal:wght@400;500;700;800&display=swap">
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ cb }}">
</head>
<body class="auth-page {{ 'rtl' if dir == 'rtl' else '' }}">
<div class="auth-card">
  <a href="/" class="logo center">
    <svg class="ico" aria-hidden="true" width="36" height="36" viewBox="0 0 24 24"><path d="M7 18a5 5 0 0 1-.7-9.95 6 6 0 0 1 11.6 1.05A4 4 0 0 1 17 18z" fill="#c98a3e"/></svg>
    <span>CloudVault</span>
  </a>
  <h1><svg class="ico" aria-hidden="true" width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="11" width="18" height="11" rx="2" ry="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg> {% if lang == 'ar' %}كلمة مرور مطلوبة{% else %}Password required{% endif %}</h1>
  <p class="sub">{% if lang == 'ar' %}هذا الملف المشارك محمي بكلمة مرور.{% else %}This shared file is password-protected.{% endif %}</p>
  {% if error %}<div class="alert error">{{ error }}</div>{% endif %}
  <form method="POST" action="{{ url_for('public_share', token=token) }}">
    <label>{% if lang == 'ar' %}كلمة المرور{% else %}Password{% endif %}</label>
    <input type="password" name="password" required autofocus placeholder="••••••••">
    <button type="submit" class="btn btn-primary btn-block">{% if lang == 'ar' %}فتح الملف{% else %}Unlock{% endif %}</button>
  </form>
</div>
<script src="/static/js/pwa.js?v={{ cb }}" defer></script>
</body>
</html>
