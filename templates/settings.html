<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<meta name="color-scheme" content="dark">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CloudVault">
<meta name="mobile-web-app-capable" content="yes">
<meta name="msapplication-TileColor" content="#0a0a0c">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<title>Settings — CloudVault</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ cb }}">
</head>
<body>
{% include '_appnav.html' %}

<div class="settings-page">
  <div class="settings-bar">
    <h1>Settings</h1>
  </div>

  <div class="settings-card">
    <h2>Account</h2>
    <p class="muted">Update your profile information</p>
    <label>Email</label>
    <input type="email" value="{{ user.email }}" disabled>
    <label>Display name</label>
    <input type="text" id="nameInput" value="{{ user.name }}">
    <div class="row">
      <button class="btn btn-primary" id="saveName">Save changes</button>
    </div>
  </div>

  <div class="settings-card">
    <h2>Storage</h2>
    <p class="muted">Your CloudVault usage</p>
    <div class="bar" style="margin: 14px 0;"><div class="bar-fill" id="barFill"></div></div>
    <div class="storage-text" id="storageText" style="font-size: 14px;">— / —</div>
  </div>

  <div class="settings-card">
    <h2>Change password</h2>
    <p class="muted">Use 6+ characters</p>
    <label>Current password</label>
    <input type="password" id="curPw">
    <label>New password</label>
    <input type="password" id="newPw">
    <div class="row">
      <button class="btn btn-primary" id="savePw">Update password</button>
    </div>
  </div>

  <div class="settings-card danger-zone">
    <h2>Danger zone</h2>
    <p class="muted">Sign out from this device</p>
    <div class="row">
      <a href="{{ url_for('logout') }}" class="btn btn-ghost danger">Sign out</a>
    </div>
  </div>
</div>

<div id="toast" class="toast" hidden></div>
<script>
function fmtSize(b) {
  if (!b) return '0 B';
  const u=['B','KB','MB','GB','TB']; let i=0;
  while (b>=1024 && i<u.length-1) { b/=1024; i++; }
  return b.toFixed(b<10?1:0)+' '+u[i];
}
function toast(m, t='') { const e=document.getElementById('toast'); e.textContent=m; e.className='toast '+t; e.hidden=false; setTimeout(()=>e.hidden=true, 2400); }

fetch('/api/me').then(r=>r.json()).then(me=>{
  const pct = Math.min(100, (me.used / me.quota) * 100);
  document.getElementById('barFill').style.width = pct + '%';
  document.getElementById('storageText').textContent = `${fmtSize(me.used)} of ${fmtSize(me.quota)} used (${pct.toFixed(1)}%)`;
});

document.getElementById('saveName').onclick = async () => {
  const name = document.getElementById('nameInput').value.trim();
  const r = await fetch('/api/me', { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ name }) });
  toast(r.ok ? 'Saved' : 'Failed', r.ok ? 'success' : 'error');
};

document.getElementById('savePw').onclick = async () => {
  const current_password = document.getElementById('curPw').value;
  const new_password = document.getElementById('newPw').value;
  if (new_password.length < 6) return toast('Password too short', 'error');
  const r = await fetch('/api/me', { method:'PATCH', headers:{'Content-Type':'application/json'}, body: JSON.stringify({ current_password, new_password }) });
  if (r.ok) {
    toast('Password updated', 'success');
    document.getElementById('curPw').value = '';
    document.getElementById('newPw').value = '';
  } else {
    const e = await r.json();
    toast(e.error || 'Failed', 'error');
  }
};
</script>
<script src="/static/js/appnav.js?v={{ cb }}" defer></script>
<script src="/static/js/pwa.js?v={{ cb }}" defer></script>
</body>
</html>
