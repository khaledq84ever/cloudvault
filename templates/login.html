<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1129">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="CloudVault">
<meta name="mobile-web-app-capable" content="yes">
<meta name="msapplication-TileColor" content="#0d1129">
<meta name="format-detection" content="telephone=no">
<link rel="manifest" href="/manifest.webmanifest">
<link rel="icon" type="image/png" sizes="32x32" href="/static/icons/favicon-32.png">
<link rel="apple-touch-icon" sizes="180x180" href="/static/icons/apple-touch-icon.png">
<title>Sign in — CloudVault</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/app.css') }}?v={{ cb }}">
</head>
<body class="auth-page">
<div class="auth-card">
  <a href="/" class="logo center">
    <svg width="42" height="42" viewBox="0 0 24 24" fill="none">
      <defs><linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0%" stop-color="#6366f1"/><stop offset="100%" stop-color="#a855f7"/></linearGradient></defs>
      <path d="M7 18a5 5 0 0 1-.7-9.95 6 6 0 0 1 11.6 1.05A4 4 0 0 1 17 18z" fill="url(#lg)"/>
    </svg>
    <span style="font-size: 22px;">CloudVault</span>
  </a>
  <h1>Welcome back</h1>
  <p class="sub">Sign in to access your files</p>
  {% with msgs = get_flashed_messages(with_categories=true) %}
    {% for cat, msg in msgs %}<div class="alert {{cat}}">{{msg}}</div>{% endfor %}
  {% endwith %}
  <form method="POST">
    <label>Email</label>
    <input type="email" name="email" required autofocus>
    <label>Password</label>
    <input type="password" name="password" required>
    <button type="submit" class="btn btn-primary btn-block">Sign in</button>
  </form>
  <p class="alt" style="margin-bottom:6px"><a href="{{ url_for('forgot_password') }}">Forgot password?</a></p>
  <p class="alt">New to CloudVault? <a href="{{ url_for('register') }}">Create an account</a></p>
</div>
<script src="/static/js/pwa.js?v={{ cb }}" defer></script>
</body>
</html>
